name: Build APK & Deploy GamerZone PK Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: gradle :app:assembleDebug

      - name: Package APK into Website Downloads
        run: |
          mkdir -p website/downloads
          cp app/build/outputs/apk/debug/app-debug.apk website/downloads/gamerzone-pk.apk

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
